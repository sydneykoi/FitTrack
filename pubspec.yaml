name: fittrack
description: "A personal fitness and activity tracker to help users track workouts, monitor progress, and stay motivated."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.0

  # Charts for Stats Screen
  fl_chart: ^0.68.0

  # Internationalization (for formatting)
  intl: ^0.19.0

  # Cupertino Icons for iOS style icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Flutter code linting
  flutter_lints: ^3.0.0

  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

# Flutter configuration
flutter:
  uses-material-design: true

  # Assets folder
  assets:
    - assets/icon/

# App Icon Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21